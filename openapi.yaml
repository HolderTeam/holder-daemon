openapi: 3.0.3
info:
  title: Holder API
  version: 0.1.0
servers:
  - url: /
  - url: http://127.0.0.1:11499
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/Error"
    HealthData:
      type: object
      required: [db_ok, uptime_ms, api_version, server_version, pid]
      properties:
        db_ok:
          type: boolean
        uptime_ms:
          type: integer
          format: int64
        api_version:
          type: string
        server_version:
          type: string
        pid:
          type: integer
    HealthResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/HealthData"
    CardCreateRequest:
      type: object
      required: [project_id, title, content]
      properties:
        card_id:
          type: string
          description: Optional; server generates if omitted.
        project_id:
          type: string
        title:
          type: string
        content:
          type: string
        created_at:
          type: integer
          format: int64
          description: Optional; server uses current time if omitted or 0.
        updated_at:
          type: integer
          format: int64
          description: Optional; server uses created_at if omitted or 0.
        parent_card_id:
          type: string
          nullable: true
        sort_key:
          type: number
          format: double
        rel_path:
          type: string
          nullable: true
    CardCreateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [card_id, rel_path]
          properties:
            card_id:
              type: string
            rel_path:
              type: string
    CardUpdateRequest:
      type: object
      required: [content, updated_at]
      properties:
        content:
          type: string
        updated_at:
          type: integer
          format: int64
        title:
          type: string
          nullable: true
    CardData:
      type: object
      required:
        [card_id, project_id, title, rel_path, sort_key, created_at, updated_at, content]
      properties:
        card_id:
          type: string
        project_id:
          type: string
        title:
          type: string
        rel_path:
          type: string
        sort_key:
          type: number
          format: double
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        parent_card_id:
          type: string
          nullable: true
        deleted_at:
          type: integer
          format: int64
          nullable: true
        content:
          type: string
    CardGetResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/CardData"
    CardListItem:
      type: object
      required:
        [card_id, project_id, title, rel_path, sort_key, created_at, updated_at]
      properties:
        card_id:
          type: string
        project_id:
          type: string
        title:
          type: string
        rel_path:
          type: string
        sort_key:
          type: number
          format: double
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        parent_card_id:
          type: string
          nullable: true
        deleted_at:
          type: integer
          format: int64
          nullable: true
    CardListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/CardListItem"
    CardPatchResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [card_id]
          properties:
            card_id:
              type: string
    CardLink:
      type: object
      required: [from_card_id, to_card_id, to_type, kind, created_at]
      properties:
        from_card_id:
          type: string
        to_card_id:
          type: string
        to_type:
          type: string
          description: Target type (card, ai_message, ai_thread, resource).
        kind:
          type: string
        label:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
    CardLinkCreateRequest:
      type: object
      required: [to_card_id]
      properties:
        to_card_id:
          type: string
        to_type:
          type: string
          description: Optional; defaults to "card".
        kind:
          type: string
          description: Optional; defaults to "ref".
        label:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
          description: Optional; server uses current time if omitted or 0.
    CardLinkCreateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/CardLink"
    CardLinkListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/CardLink"
    CardLinkDeleteRequest:
      type: object
      properties:
        to_card_id:
          type: string
        kind:
          type: string
    SearchCardItem:
      type: object
      required: [card_id, title, updated_at, created_at, snippet, rank]
      properties:
        card_id:
          type: string
        title:
          type: string
        updated_at:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
        snippet:
          type: string
        rank:
          type: number
          format: double
    SearchMessageItem:
      type: object
      required: [message_id, created_at, snippet, rank]
      properties:
        message_id:
          type: string
        created_at:
          type: integer
          format: int64
        snippet:
          type: string
        rank:
          type: number
          format: double
    AiMessage:
      type: object
      required: [message_id, thread_id, role, source, content, created_at]
      properties:
        message_id:
          type: string
        thread_id:
          type: string
        role:
          type: string
        source:
          type: string
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        content:
          type: string
        created_at:
          type: integer
          format: int64
        prompt_hash:
          type: string
          nullable: true
        meta_json:
          type: string
          nullable: true
    AiMessageCreateRequest:
      type: object
      required: [thread_id, role, source, content]
      properties:
        message_id:
          type: string
          description: Optional; server generates if omitted.
        thread_id:
          type: string
        role:
          type: string
        source:
          type: string
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        content:
          type: string
        created_at:
          type: integer
          format: int64
          description: Optional; server uses current time if omitted or 0.
        prompt_hash:
          type: string
          nullable: true
        meta_json:
          type: string
          nullable: true
    AiMessageCreateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [message_id]
          properties:
            message_id:
              type: string
    AiThread:
      type: object
      required: [thread_id, project_id, title, created_at, updated_at]
      properties:
        thread_id:
          type: string
        project_id:
          type: string
        card_id:
          type: string
          nullable: true
        title:
          type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    AiThreadCreateRequest:
      type: object
      required: [project_id, title]
      properties:
        thread_id:
          type: string
          description: Optional; server generates if omitted.
        project_id:
          type: string
        title:
          type: string
        card_id:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
          description: Optional; server uses current time if omitted or 0.
        updated_at:
          type: integer
          format: int64
          description: Optional; server uses created_at if omitted or 0.
    AiThreadCreateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [thread_id]
          properties:
            thread_id:
              type: string
    AiThreadUpdateRequest:
      type: object
      required: [updated_at]
      properties:
        title:
          type: string
          nullable: true
        card_id:
          type: string
          nullable: true
        updated_at:
          type: integer
          format: int64
    AiThreadListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/AiThread"
    AiThreadGetResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/AiThread"
    AiThreadPatchResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [thread_id]
          properties:
            thread_id:
              type: string
    AiMessageListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/AiMessage"
    AiMessageGetResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/AiMessage"
    Project:
      type: object
      required: [project_id, name, root_path, created_at, updated_at]
      properties:
        project_id:
          type: string
        name:
          type: string
        root_path:
          type: string
        git_remote_url:
          type: string
          nullable: true
        git_provider:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    ProjectCreateRequest:
      type: object
      required: [name]
      properties:
        project_id:
          type: string
          description: Optional; server generates if omitted.
        name:
          type: string
        root_path:
          type: string
          description: Optional; server chooses a default if omitted.
        git_remote_url:
          type: string
          nullable: true
        git_provider:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
          description: Optional; server uses current time if omitted or 0.
        updated_at:
          type: integer
          format: int64
          description: Optional; server uses created_at if omitted or 0.
    ProjectCreateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [project_id]
          properties:
            project_id:
              type: string
    ProjectListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    ProjectGetResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/Project"
    ProjectUpdateRequest:
      type: object
      required: [updated_at]
      properties:
        name:
          type: string
          nullable: true
        root_path:
          type: string
          nullable: true
        git_remote_url:
          type: string
          nullable: true
        git_provider:
          type: string
          nullable: true
        updated_at:
          type: integer
          format: int64
    ProjectUpdateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [project_id]
          properties:
            project_id:
              type: string
    ProjectDeleteResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [project_id]
          properties:
            project_id:
              type: string
    Resource:
      type: object
      required: [resource_id, project_id, kind, uri, label, created_at, updated_at]
      properties:
        resource_id:
          type: string
        project_id:
          type: string
        kind:
          type: string
        uri:
          type: string
        label:
          type: string
        desc:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    ResourceCreateRequest:
      type: object
      required: [project_id, kind, uri, label]
      properties:
        resource_id:
          type: string
          description: Optional; server generates if omitted.
        project_id:
          type: string
        kind:
          type: string
        uri:
          type: string
        label:
          type: string
        desc:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
          description: Optional; server uses current time if omitted or 0.
        updated_at:
          type: integer
          format: int64
          description: Optional; server uses created_at if omitted or 0.
    ResourceCreateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [resource_id]
          properties:
            resource_id:
              type: string
    ResourceListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
    ResourceDeleteResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [resource_id]
          properties:
            resource_id:
              type: string
    SearchCardsResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/SearchCardItem"
    SearchMessagesResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/SearchMessageItem"
paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects:
    get:
      summary: List projects
      parameters:
        - in: query
          name: name
          required: false
          schema:
            type: string
          description: Substring match on project name.
        - in: query
          name: updated_after
          required: false
          schema:
            type: integer
            format: int64
          description: Return projects with updated_at >= updated_after.
        - in: query
          name: updated_before
          required: false
          schema:
            type: integer
            format: int64
          description: Return projects with updated_at <= updated_before.
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum:
              [updated_at_desc, updated_at_asc, created_at_desc, created_at_asc, name_desc, name_asc]
          description: Order by updated_at (default), created_at, or name.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 1000
          description: Max results (default 100, capped at 1000).
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
          description: Offset into ordered results (default 0).
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCreateResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects/{project_id}:
    get:
      summary: Get a project
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectGetResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      summary: Update a project
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUpdateResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete a project
      parameters:
        - in: path
          name: project_id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDeleteResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cards:
    get:
      summary: List cards
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
        - in: query
          name: parent_card_id
          required: false
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardListResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardCreateResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cards/{card_id}:
    get:
      summary: Fetch a card
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardGetResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /cards/{card_id}/links:
    get:
      summary: List outgoing links for a card
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardLinkListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create or update a link from a card
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardLinkCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardLinkCreateResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      summary: Delete links from a card
      description: Provide to_card_id (and optional kind) to delete a specific link. If omitted, deletes all outgoing links.
      parameters:
        - name: card_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardLinkDeleteRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPatchResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
