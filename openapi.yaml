paths:
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /openapi.yaml:
    get:
      summary: Download the OpenAPI specification
      security: []
      responses:
        "200":
          description: OK
          content:
            application/yaml:
              schema:
                type: string
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai_catalog.yaml:
    get:
      summary: Download canonical AI catalog config (models + cloud)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/yaml:
              schema:
                type: string
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /ai_catalog.json:
    get:
      summary: Download canonical AI catalog config as JSON
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /git_providers.yaml:
    get:
      summary: Download git provider UI/runtime config
      security: []
      responses:
        "200":
          description: OK
          content:
            application/yaml:
              schema:
                type: string
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /git_providers.json:
    get:
      summary: Download git provider UI/runtime config as JSON
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
