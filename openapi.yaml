openapi: 3.0.3
info:
  title: Holder API
  version: 0.1.0
servers:
  - url: /
  - url: http://127.0.0.1:11499
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: token
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      required: [ok, error]
      properties:
        ok:
          type: boolean
          enum: [false]
        error:
          $ref: "#/components/schemas/Error"
    HealthData:
      type: object
      required: [db_ok, uptime_ms, api_version, server_version, pid, crypt_filter]
      properties:
        db_ok:
          type: boolean
        uptime_ms:
          type: integer
          format: int64
        api_version:
          type: string
        server_version:
          type: string
        pid:
          type: integer
        crypt_filter:
          type: object
          required: [path, exists, executable]
          properties:
            path:
              type: string
            exists:
              type: boolean
            executable:
              type: boolean
    HealthResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/HealthData"
    LocalModel:
      type: object
      required: [name]
      properties:
        name:
          type: string
        digest:
          type: string
        size:
          type: integer
          format: int64
        modified_at:
          type: string
    CasteInfo:
      type: object
      required: [name]
      properties:
        name:
          type: string
          enum: [mini, user, developer, workstation, rig]
        reason:
          type: string
          nullable: true
    CasteRecommendedModel:
      type: object
      required: [tag, required_caste, installed]
      properties:
        tag:
          type: string
        provider:
          type: string
          nullable: true
        engine:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        required_caste:
          type: string
          enum: [mini, user, developer, workstation, rig]
        installed:
          type: boolean
    RunnerCapabilitiesData:
      type: object
      required: [runner_available, last_checked, local_model_config, models, recommended_models, recommended_install]
      properties:
        runner_available:
          type: boolean
        spawn_attempted:
          type: boolean
        last_checked:
          type: integer
          format: int64
        version:
          type: string
        error:
          type: string
          nullable: true
        caste:
          allOf:
            - $ref: "#/components/schemas/CasteInfo"
          nullable: true
        local_model_config:
          $ref: "#/components/schemas/AiLocalModelConfigData"
        models:
          type: array
          items:
            $ref: "#/components/schemas/LocalModel"
        recommended_models:
          type: array
          items:
            $ref: "#/components/schemas/CasteRecommendedModel"
        recommended_install:
          type: array
          items:
            $ref: "#/components/schemas/CasteRecommendedModel"
    RunnerCapabilitiesResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/RunnerCapabilitiesData"
    AiLocalModelConfigData:
      type: object
      required: [fast_model, strong_model, deep_model, updated_at]
      properties:
        fast_model:
          type: string
          nullable: true
        strong_model:
          type: string
          nullable: true
        deep_model:
          type: string
          nullable: true
        updated_at:
          type: integer
          format: int64
          nullable: true
    AiLocalModelConfigResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/AiLocalModelConfigData"
    AiLocalModelConfigUpdateRequest:
      type: object
      properties:
        fast_model:
          type: string
          nullable: true
        strong_model:
          type: string
          nullable: true
        deep_model:
          type: string
          nullable: true
        updated_at:
          type: integer
          format: int64
          nullable: true
    RunnerPullProgress:
      type: object
      required: [completed, total, percent, stage]
      properties:
        completed:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        percent:
          type: number
          format: double
        stage:
          type: string
    RunnerPullJob:
      type: object
      required: [job_id, model, status, updated_at, progress]
      properties:
        job_id:
          type: string
        model:
          type: string
        status:
          type: string
        updated_at:
          type: integer
          format: int64
        error:
          type: string
          nullable: true
        progress:
          $ref: "#/components/schemas/RunnerPullProgress"
    RunnerPullStartResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [job_id, model, status]
          properties:
            job_id:
              type: string
            model:
              type: string
            status:
              type: string
    RunnerPullStatusResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/RunnerPullJob"
    AiStatusPullJob:
      allOf:
        - $ref: "#/components/schemas/RunnerPullJob"
        - type: object
          required: [active]
          properties:
            active:
              type: boolean
    AiProviderCredential:
      type: object
      required: [provider, configured, api_key_preview, created_at, updated_at]
      properties:
        provider:
          type: string
        configured:
          type: boolean
        api_key_preview:
          type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    AiProviderCredentialsListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [providers]
          properties:
            providers:
              type: array
              items:
                $ref: "#/components/schemas/AiProviderCredential"
    AiProviderCredentialUpsertRequest:
      type: object
      required: [provider, api_key]
      properties:
        provider:
          type: string
        api_key:
          type: string
        updated_at:
          type: integer
          format: int64
          nullable: true
    AiProviderCredentialUpsertResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/AiProviderCredential"
    AiProviderCredentialDeleteResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [provider]
          properties:
            provider:
              type: string
    AiProviderCatalogProvider:
      type: object
      required: [id, display_name, enabled, configured, api, auth, models]
      properties:
        id:
          type: string
        display_name:
          type: string
        enabled:
          type: boolean
        configured:
          type: boolean
        api:
          type: object
          additionalProperties: true
          nullable: true
        auth:
          type: object
          additionalProperties: true
          nullable: true
        models:
          type: array
          items:
            type: object
            additionalProperties: true
        setup_url:
          type: string
          nullable: true
        docs_url:
          type: string
          nullable: true
        api_key_label:
          type: string
          nullable: true
        api_key_hint:
          type: string
          nullable: true
    AiProviderCatalogResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [providers]
          properties:
            default_provider:
              type: string
              nullable: true
            providers:
              type: array
              items:
                $ref: "#/components/schemas/AiProviderCatalogProvider"
    AiStatusData:
      type: object
      required: [checked_at, runner_available, runner_last_checked, active_runs, active_pull_jobs, pulls, cloud, cloud_configured_providers]
      properties:
        checked_at:
          type: integer
          format: int64
        runner_available:
          type: boolean
        runner_last_checked:
          type: integer
          format: int64
        runner_version:
          type: string
          nullable: true
        runner_error:
          type: string
          nullable: true
        active_runs:
          type: integer
          format: int64
        active_pull_jobs:
          type: integer
          format: int64
        pulls:
          type: array
          items:
            $ref: "#/components/schemas/AiStatusPullJob"
        cloud:
          type: array
          items:
            $ref: "#/components/schemas/AiProviderCredential"
        cloud_configured_providers:
          type: integer
          format: int64
    AiStatusResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/AiStatusData"
    AiRunCreateRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
        mode:
          type: string
          description: auto or model
        model:
          type: string
          description: Optional explicit model id; interpreted for local or cloud selected provider.
        provider:
          type: string
          description: Optional cloud provider id when local runner is unavailable.
        project_id:
          type: string
        thread_id:
          type: string
        context:
          type: object
          additionalProperties: true
    AiRunItem:
      type: object
      required: [run_id, mode, prompt, status, created_at, updated_at]
      properties:
        run_id:
          type: string
        project_id:
          type: string
          nullable: true
        thread_id:
          type: string
          nullable: true
        message_id:
          type: string
          nullable: true
        mode:
          type: string
        prompt:
          type: string
        context_json:
          type: string
          nullable: true
        router_model:
          type: string
          nullable: true
        ranked_json:
          type: string
          nullable: true
        policy_trace_json:
          type: string
          nullable: true
        policy_trace:
          type: object
          nullable: true
          additionalProperties: true
        chosen_model:
          type: string
          nullable: true
        status:
          type: string
        error:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    AiRunListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/AiRunItem"
    AiRunGetResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/AiRunItem"
    RebuildRequest:
      type: object
      required: [project_id]
      properties:
        project_id:
          type: string
    RebuildData:
      type: object
      required: [project_id, cards, ai_messages, ai_threads, links]
      properties:
        project_id:
          type: string
        cards:
          type: integer
        ai_messages:
          type: integer
        ai_threads:
          type: integer
        links:
          type: integer
    RebuildResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/RebuildData"
    CardCreateRequest:
      type: object
      required: [project_id, title, content]
      properties:
        card_id:
          type: string
          description: Optional; server generates if omitted.
        project_id:
          type: string
        title:
          type: string
        content:
          type: string
        created_at:
          type: integer
          format: int64
          description: Optional; server uses current time if omitted or 0.
        updated_at:
          type: integer
          format: int64
          description: Optional; server uses created_at if omitted or 0.
        parent_card_id:
          type: string
          nullable: true
        sort_key:
          type: number
          format: double
        rel_path:
          type: string
          nullable: true
    CardCreateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [card_id, rel_path]
          properties:
            card_id:
              type: string
            rel_path:
              type: string
    CardUpdateRequest:
      type: object
      required: [updated_at]
      properties:
        content:
          type: string
        updated_at:
          type: integer
          format: int64
        title:
          type: string
          nullable: true
        parent_card_id:
          type: string
          nullable: true
        sort_key:
          type: number
          format: double
    CardData:
      type: object
      required:
        [card_id, project_id, title, rel_path, sort_key, created_at, updated_at, content]
      properties:
        card_id:
          type: string
        project_id:
          type: string
        title:
          type: string
        rel_path:
          type: string
        sort_key:
          type: number
          format: double
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        parent_card_id:
          type: string
          nullable: true
        deleted_at:
          type: integer
          format: int64
          nullable: true
        content:
          type: string
    CardGetResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/CardData"
    CardListItem:
      type: object
      required:
        [card_id, project_id, title, rel_path, sort_key, created_at, updated_at]
      properties:
        card_id:
          type: string
        project_id:
          type: string
        title:
          type: string
        rel_path:
          type: string
        sort_key:
          type: number
          format: double
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
        parent_card_id:
          type: string
          nullable: true
        deleted_at:
          type: integer
          format: int64
          nullable: true
        child_count:
          type: integer
          minimum: 0
          description: Present when count=true.
    CardListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/CardListItem"
    CardPatchResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [card_id]
          properties:
            card_id:
              type: string
    CardMoveIntent:
      type: string
      enum: [into, before, after, left, right, to_start, to_end, up_level]
    CardMoveRequest:
      type: object
      required: [project_id, intent]
      properties:
        project_id:
          type: string
        intent:
          $ref: "#/components/schemas/CardMoveIntent"
        target_card_id:
          type: string
          nullable: true
          description: Required for intents into/before/after.
        parent_card_id:
          type: string
          nullable: true
          description: Optional parent scope for intents to_start/to_end/left/right. If omitted, source card's current parent scope is used.
        if_revision:
          type: integer
          format: int64
          nullable: true
          description: Optional optimistic-concurrency revision guard.
    CardMoveResult:
      type: object
      required: [card_id, parent_card_id, sort_key, revision]
      properties:
        card_id:
          type: string
        parent_card_id:
          type: string
          nullable: true
        sort_key:
          type: number
          format: double
        revision:
          type: integer
          format: int64
        moved_into_title:
          type: string
          nullable: true
    CardMoveResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/CardMoveResult"
    CardContextCard:
      allOf:
        - $ref: "#/components/schemas/CardListItem"
        - type: object
          properties:
            child_count:
              type: integer
    CardContextBreadcrumb:
      type: object
      required: [type, title]
      properties:
        type:
          type: string
          enum: [project, card]
        title:
          type: string
        project_id:
          type: string
          nullable: true
        card_id:
          type: string
          nullable: true
    CardContextData:
      type: object
      required: [project, current_parent_card_id, breadcrumbs, cards]
      properties:
        project:
          type: object
          required: [project_id, name]
          properties:
            project_id:
              type: string
            name:
              type: string
        current_parent_card_id:
          type: string
          nullable: true
        breadcrumbs:
          type: array
          items:
            $ref: "#/components/schemas/CardContextBreadcrumb"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/CardContextCard"
    CardContextResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/CardContextData"
    CardLink:
      type: object
      required: [from_card_id, to_card_id, to_type, kind, created_at]
      properties:
        from_card_id:
          type: string
        to_card_id:
          type: string
        to_type:
          type: string
          description: Target type (card, ai_message, ai_thread, resource).
        kind:
          type: string
        label:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
    CardLinkCreateRequest:
      type: object
      required: [to_card_id]
      properties:
        to_card_id:
          type: string
        to_type:
          type: string
          description: Optional; defaults to "card".
        kind:
          type: string
          description: Optional; defaults to "ref".
        label:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
          description: Optional; server uses current time if omitted or 0.
    CardLinkCreateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          $ref: "#/components/schemas/CardLink"
    CardLinkListResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: array
          items:
            $ref: "#/components/schemas/CardLink"
    CardLinkDeleteRequest:
      type: object
      properties:
        to_card_id:
          type: string
        to_type:
          type: string
        kind:
          type: string
    SearchCardItem:
      type: object
      required: [card_id, title, updated_at, created_at, snippet, rank]
      properties:
        card_id:
          type: string
        title:
          type: string
        updated_at:
          type: integer
          format: int64
        created_at:
          type: integer
          format: int64
        snippet:
          type: string
        rank:
          type: number
          format: double
    SearchMessageItem:
      type: object
      required: [message_id, created_at, snippet, rank]
      properties:
        message_id:
          type: string
        created_at:
          type: integer
          format: int64
        snippet:
          type: string
        rank:
          type: number
          format: double
    AiMessage:
      type: object
      required: [message_id, thread_id, role, source, content, created_at]
      properties:
        message_id:
          type: string
        thread_id:
          type: string
        role:
          type: string
        source:
          type: string
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        content:
          type: string
        created_at:
          type: integer
          format: int64
        deleted_at:
          type: integer
          format: int64
          nullable: true
        prompt_hash:
          type: string
          nullable: true
        meta_json:
          type: string
          nullable: true
    AiMessageCreateRequest:
      type: object
      required: [thread_id, role, source, content]
      properties:
        message_id:
          type: string
          description: Optional; server generates if omitted.
        thread_id:
          type: string
        role:
          type: string
        source:
          type: string
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        content:
          type: string
        created_at:
          type: integer
          format: int64
          description: Optional; server uses current time if omitted or 0.
        prompt_hash:
          type: string
          nullable: true
        meta_json:
          type: string
          nullable: true
    AiMessageCreateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [message_id]
          properties:
            message_id:
              type: string
    AiMessageCaptureRequest:
      type: object
      required: [project_id, prompt, response]
      properties:
        project_id:
          type: string
        thread_id:
          type: string
          nullable: true
        prompt:
          type: string
        response:
          type: string
        source:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        url:
          type: string
          nullable: true
        context:
          type: object
          additionalProperties: true
          nullable: true
        created_at:
          type: integer
          format: int64
          nullable: true
    AiMessageCaptureResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [thread_id, user_message_id, assistant_message_id]
          properties:
            thread_id:
              type: string
            user_message_id:
              type: string
            assistant_message_id:
              type: string
    AiMessageUpdateRequest:
      type: object
      properties:
        role:
          type: string
          nullable: true
        source:
          type: string
          nullable: true
        provider:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        content:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
        prompt_hash:
          type: string
          nullable: true
        meta_json:
          type: string
          nullable: true
    AiMessageUpdateResponse:
      type: object
      required: [ok, data]
      properties:
        ok:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [message_id]
          properties:
            message_id:
              type: string
    AiThread:
      type: object
      required: [thread_id, project_id, title, created_at, updated_at]
      properties:
        thread_id:
          type: string
        project_id:
          type: string
        card_id:
          type: string
          nullable: true
        title:
          type: string
        created_at:
          type: integer
          format: int64
        updated_at:
          type: integer
          format: int64
    AiThreadCreateRequest:
      type: object
      required: [project_id, title]
      properties:
        thread_id:
          type: string
          description: Optional; server generates if omitted.
        project_id:
          type: string
        title:
          type: string
        card_id:
          type: string
          nullable: true
        created_at:
          type: integer
          format: int64
          description: Optional; server uses current time if omitted or 0.
        updated_at:
          type: integer
          format: int64
