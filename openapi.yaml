                additionalProperties: true
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rebuild:
    post:
      summary: Rebuild database state from project files
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebuildRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebuildResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /projects:
    get:
      summary: List projects
      parameters:
        - in: query
          name: name
          required: false
          schema:
            type: string
          description: Substring match on project name.
        - in: query
          name: updated_after
          required: false
          schema:
            type: integer
            format: int64
          description: Return projects with updated_at >= updated_after.
        - in: query
          name: updated_before
          required: false
          schema:
            type: integer
            format: int64
          description: Return projects with updated_at <= updated_before.
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum:
              [updated_at_desc, updated_at_asc, created_at_desc, created_at_asc, name_desc, name_asc]
          description: Order by updated_at (default), created_at, or name.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 1000
          description: Max results (default 100, capped at 1000).
        - in: query
          name: offset
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
          description: Offset into ordered results (default 0).
        - in: query
          name: count
          required: false
          schema:
            type: boolean
            default: false
          description: Include count fields (card_count/root_card_count) per project.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
