  /cards:
    get:
      summary: List cards
      parameters:
        - in: query
          name: project_id
          required: true
          schema:
            type: string
        - in: query
          name: view
          required: false
          schema:
            type: string
            enum: [tree, recent]
            default: tree
          description: Card list mode. tree returns one hierarchy level (roots or a parent's children); recent returns recently updated cards.
        - in: query
          name: parent_card_id
          required: false
          schema:
            type: string
          description: Optional when view=tree. Omit for roots; set to return that parent card's children.
        - in: query
          name: order
          required: false
          schema:
            type: string
            enum: [tree_default, updated_desc, title_asc]
          description: |
            Card ordering strategy. Defaults are view-aware: tree uses tree_default
            (sort_key asc, updated_at desc, title asc), recent uses updated_desc.
        - in: query
          name: count
          required: false
          schema:
            type: boolean
            default: false
          description: Include count fields (child_count) in returned card items.
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 5000
            default: 200
          description: Maximum number of cards when view=recent.
        - in: query
          name: include_deleted
          required: false
          schema:
            type: integer
          description: Set to 1 to include deleted cards.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardListResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      summary: Create a card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCreateRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardCreateResponse"
        "400":
          description: Bad request
          content:
            application/json:
