      endpoint: https://api.openai.com/v1
      api_key_required: true
      notes: |
        - General-purpose multimodal cloud model
        - Widely supported across tooling and SDKs
        - Usage-based pricing via API
        - 0.1: Just use web/cli and copy-pasta

    - provider: Anthropic
      engine: Claude
      endpoint: https://api.anthropic.com/v1
      api_key_required: true
      notes: |
        - Strong reasoning and writing model
        - Popular for long-context and document-heavy tasks
        - API access required for programmatic use
        - 0.1: Just use web/cli and copy-pasta

    - provider: Groq
      engine: Llama
      endpoint: https://api.groq.com/openai/v1
      api_key_required: true
      notes: |
        - Extremely fast inference
        - OpenAI-compatible API surface
        - Best suited for latency-sensitive workloads
        - 0.1: Just use web/cli and copy-pasta
