info:
  title: Model List
  version: 0.1.0
  author: Holder Team
  purpose: >
    Canonical model/service catalogue for Holder. The backend keeps this as the
    single source of truth and frontends render it as an AI catalogue.
  behaviour: |
    - Web entries are not called via API
    - Frontends open the URL in the user's browser
    - Users run the prompt on the website and copy/paste the result back into a card
    - Cloud entries are called via HTTP APIs (key required)
    - Local entries are routed to local runtimes (e.g. Ollama)
  disclaimer: |
    - Information is collected from publicly available sources and hands-on use
    - Model availability, limits, and behaviour change frequently
    - Details may be incomplete, outdated, or occasionally wrong
    - No guarantees or promises are made about accuracy or service quality
    - This list is descriptive, not an endorsement
    - If you find something wrong, please make a PR and fix it
    - generosity refers to the free tier unless notes say otherwise
  last_updated: 2026-01-30


schema:
  enums:
    local_category: [router, code, reason, writing, general]
    capability: [code, reasoning, summarize, translate, planning, chat, vision]
    speed: [fast, medium, slow]
    quality: [low, medium, high]
    hardware_tier: [tiny, budget, laptop, gaming, workstation]
  LocalEntry:
    required: [tag]
    optional:
      - provider
      - engine
      - parameters
      - size
      - homepage
      - notes
      - category
      - capabilities
      - speed
      - quality
      - hardware_tier
      - context_window
    field_notes:
      tag: "Ollama tag or local identifier."
      category: "Primary intent for routing."
      capabilities: "Tags used by router + client UI."
      speed: "Rough latency class."
      quality: "Rough output quality."
      hardware_tier: "Suggested minimum hardware."
      context_window: "Approx token window (if known)."
  WebEntry:
    required: [provider, engine, url]
    optional: [generosity, login_required, notes]
  CloudEntry:
    required: [provider, engine, api, auth]
    optional: [pricing, notes]


# ============================================================
# Model ranking rubric (normative)
# ============================================================
# These enums are intentionally coarse and deterministic.
# They are designed to be *literally comparable* by routing
# and ranking algorithms.
#
# Do not assign these values by vibes.
# Follow the rules below.
#
model_rubric:
  hardware_tier:
    definition: >
      Minimum practical target machine the model fits comfortably on,
      based primarily on model size.
    tiers:
      tiny:
        typical_device: "Raspberry Pi / very old laptop"
        comfortable_model_size_gb: "<= 1.5"
      budget:
        typical_device: "Low-end laptop / iGPU"
        comfortable_model_size_gb: "<= 4"
      laptop:
        typical_device: "Modern laptop / small dGPU"
        comfortable_model_size_gb: "<= 8"
      gaming:
        typical_device: "Mid-range gaming GPU"
        comfortable_model_size_gb: "<= 16"
      workstation:
        typical_device: "24GB+ VRAM or large system RAM"
        comfortable_model_size_gb: "> 16"

    assignment_rule: >
      Choose the smallest tier whose comfortable_model_size_gb
      is greater than or equal to the model's size.

  speed:
    definition: >
      Expected responsiveness on the minimum hardware_tier machine.
    values:
      fast: "Interactive; suitable for chat and UI-driven use"
      medium: "Usable latency; brief waits acceptable"
      slow: "Deliberate; long-running or batch-style use"

    ranking_weight:
      fast: 3
      medium: 2
      slow: 1

  quality:
    definition: >
      Expected correctness and usefulness for the model's intended role,
      not absolute SOTA performance.
    values:
      low: "Often needs retries; lightweight or routing tasks"
      medium: "Generally reliable local assistant"
      high: "Strong local model; fewer retries for its category"

    ranking_weight:
      low: 1
      medium: 2
      high: 3

# ============================================================
# Model catalogue
# ============================================================

Models:
  Web:
    - provider: Meta
      engine: Llama
      url: https://www.meta.ai
      generosity: Very High
      login_required: Optional
      notes: |
        - Near-unlimited casual use with no strict message caps
        - Basic chats can be started anonymously
        - Account required for chat history and full features

    - provider: Microsoft
      engine: Copilot
      url: https://copilot.microsoft.com/
      generosity: High
      login_required: Yes
      notes: |
        - Generous limits for text chat
        - Minimal throttling for most users
        - Requires Microsoft account (often already present via Windows or Outlook)

    - provider: Google
      engine: Gemini
      url: https://gemini.google.com
      generosity: Medium-High
      login_required: Yes
      notes: |
        - Daily prompt limits vary (often 50+ prompts)
        - Limits reset frequently
        - Strong integration with Google Workspace

    - provider: xAI
      engine: Grok
      url: https://grok.com/
      generosity: Medium
      login_required: Yes
      notes: |
        - Time-based message limits (roughly 10-20 per period)
        - Higher limits available with X Premium
        - Can become unavailable during peak usage with “under heavy usage” errors
        - Strong real-time and social-context responses

    - provider: Mistral AI
      engine: LeChat
      url: https://chat.mistral.ai/
      generosity: Medium-High
      login_required: Yes
      notes: |
        - Good daily limits for both basic and advanced usage
        - Paid tier provides priority access
        - Fast responses and strong cost/performance trade-offs

    - provider: DeepSeek
      engine: DeepSeek
      url: https://chat.deepseek.com/
      generosity: Very High
      login_required: Minimal
      notes: |
        - Fully free consumer chat with no strict caps
        - Minimal or optional signup for core usage
        - Popular for coding and technical tasks
        - Defaults to Chinese, add "answer in English" to your prompt

    - provider: Alibaba
      engine: Qwen
      url: https://qwen.ai/
      generosity: Medium
      login_required: Yes
      notes: |
        - Usable free tier with moderate limits
        - Strong multilingual performance
        - More generous for lighter or international usage
        - Very large user base in Asia

    - provider: Perplexity
      engine: GPT
      url: https://www.perplexity.ai/
      generosity: Medium
      login_required: Yes
      notes: |
        - Unlimited basic AI-powered search
        - Advanced and Pro features are capped
        - Experience is more “AI search engine” than chat-first
        - Underlying model varies

    - provider: Anthropic
      engine: Claude
      url: https://claude.ai
      generosity: Low-Medium
      login_required: Yes
      notes: |
        - Strict message caps (often 20-50 messages per 5-8 hours)
        - Limits reset periodically
        - Paid tier heavily prioritised
        - Excellent long-form writing and reasoning quality

    - provider: OpenAI
      engine: ChatGPT
      url: https://chatgpt.com/
      generosity: Low
      login_required: Yes
      notes: |
        - Tight caps on flagship models (often 10-60 messages per period)
        - Automatically falls back to smaller models when capped
        - Very strong default UX and ecosystem
        - Paid tiers significantly improve limits
        - Basic Subscription gives High generosity.

  Local:
    - provider: QwenTeam
      engine: Qwen2.5
      tag: qwen2.5:0.5b
      capabilities: [chat, summarize, translate]
      speed: fast
      quality: low
      hardware_tier: tiny
      context_window: 32K
      category: router
      homepage: https://github.com/QwenLM/Qwen3
      size: 397 MB
      notes: |
        - Local open-weight model
        - Suitable for low-resource devices
        - Useful for testing and offline workflows
    - provider: QwenTeam
      engine: Qwen3 Coder
      tag: qwen3-coder:30b
      capabilities: [code, reasoning, summarize]
      speed: slow
      quality: high
      hardware_tier: workstation
      context_window: 128K
      category: code
      homepage: https://github.com/QwenLM/Qwen3
      size: 18 GB
      notes: |
        - Large coding-focused model
        - Best for complex refactors, generation, and long code reasoning
        - Requires 24GB+ VRAM or large system RAM for comfort
    - provider: DeepSeek
      engine: DeepSeek R1
      tag: deepseek-r1:latest
      capabilities: [reasoning, code, planning, chat]
      speed: medium
      quality: high
      hardware_tier: laptop
      context_window: 128K
      category: reason
      homepage: https://github.com/deepseek-ai/DeepSeek-R1
      size: 5.2 GB
      notes: |
        - Strong reasoning model (chain-of-thought / thinking mode).
        - Excellent price/performance for math, logic, complex prompts.
        - Runs surprisingly well quantized.
    - provider: DeepSeek
      engine: DeepSeek Coder V2
      tag: deepseek-coder-v2:latest
      capabilities: [code, summarize, planning, chat]
      speed: medium
      quality: high
      hardware_tier: gaming
      context_window: 32K
      category: code
      homepage: https://github.com/deepseek-ai/DeepSeek-Coder
      size: 8.9 GB
      notes: |
        - Strong open-weight coding specialist
        - Good balance of size vs capability
        - Suitable default local coding model on 16GB GPUs
    - provider: Google
      engine: Gemma 3
      tag: gemma3
      capabilities: [chat, summarize, translate, reasoning, code, vision]
      speed: medium
      quality: medium
      hardware_tier: budget
      context_window: 32K
      parameters: 4B
      size: 3.3GB
      homepage: https://ai.google.dev/gemma
