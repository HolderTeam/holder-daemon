models:
  info:
    title: Model List
    version: 0.1.0
    author: Holder Team
    purpose: 'Canonical model/service catalogue for Holder. The backend keeps this as the single source of truth and frontends
      render it as an AI catalogue.
  
      '
    behaviour: '- Web entries are not called via API
  
      - Frontends open the URL in the user''s browser
  
      - Users run the prompt on the website and copy/paste the result back into a card
  
      - Cloud entries are called via HTTP APIs (key required)
  
      - Local entries are routed to local runtimes (e.g. Ollama)
  
      '
    disclaimer: '- Information is collected from publicly available sources and hands-on use
  
      - Model availability, limits, and behaviour change frequently
  
      - Details may be incomplete, outdated, or occasionally wrong
  
      - No guarantees or promises are made about accuracy or service quality
  
      - This list is descriptive, not an endorsement
  
      - If you find something wrong, please make a PR and fix it
  
      - generosity refers to the free tier unless notes say otherwise
  
      '
    last_updated: 2026-02-14
  schema:
    enums:
      local_category:
      - router
      - code
      - reason
      - writing
      - general
      capability:
      - code
      - reasoning
      - summarize
      - translate
      - planning
      - chat
      - vision
      speed:
      - fast
      - medium
      - slow
      quality:
      - low
      - medium
      - high
      hardware_tier:
      - mini
      - user
      - developer
      - workstation
      - rig
    LocalEntry:
      required:
      - tag
      optional:
      - provider
      - engine
      - parameters
      - size
      - homepage
      - notes
      - category
      - capabilities
      - speed
      - quality
      - hardware_tier
      - context_window
      field_notes:
        tag: Ollama tag or local identifier.
        category: Primary intent for routing.
        capabilities: Tags used by router + client UI.
        speed: Rough latency class.
        quality: Rough output quality.
        hardware_tier: Suggested minimum hardware.
        context_window: Approx token window (if known).
    WebEntry:
      required:
      - provider
      - engine
      - url
      optional:
      - generosity
      - login_required
      - notes
    CloudEntry:
      required:
      - provider_id
      - model_id
      - endpoint
      optional:
      - provider
      - credential_key
      - base_url
      - api_kind
      - auth_type
      - role
      - enabled
      - provider_cost_tier
      - model_cost_tier
      - default_for_low_budget
      - setup_url
      - docs_url
      - api_key_label
      - api_key_hint
      - key_param
      - header_name
      - bearer_prefix
      - provider_cooldown
      - model_cooldown
      - limits
      - notes
    ProviderDefaultsEntry:
      required:
      - provider
      - credential_key
      - base_url
      - api_kind
      - auth_type
      optional:
      - enabled
      - provider_cost_tier
      - setup_url
      - docs_url
      - api_key_label
      - api_key_hint
      - key_param
      - header_name
      - bearer_prefix
      - provider_cooldown
  model_rubric:
    hardware_tier:
      definition: 'Minimum practical target machine the model fits comfortably on, based primarily on model size.
  
        '
      tiers:
        mini:
          typical_device: Raspberry Pi / classic laptop
          comfortable_model_size_gb: <= 1.5
        user:
          typical_device: Consumer laptop / iGPU
          comfortable_model_size_gb: <= 4
        developer:
          typical_device: Premium laptop / small dGPU
          comfortable_model_size_gb: <= 8
        workstation:
          typical_device: Creative workstation, gaming PC
          comfortable_model_size_gb: <= 16
        rig:
          typical_device: 24GB+ VRAM or large system RAM
          comfortable_model_size_gb: '> 16'
      assignment_rule: 'Choose the smallest tier whose comfortable_model_size_gb is greater than or equal to the model''s size.
  
        '
    speed:
      definition: 'Expected responsiveness on the minimum hardware_tier machine.
  
        '
      values:
        fast: Interactive; suitable for chat and UI-driven use
        medium: Usable latency; brief waits acceptable
        slow: Deliberate; long-running or batch-style use
      ranking_weight:
        fast: 3
        medium: 2
        slow: 1
    quality:
      definition: 'Expected correctness and usefulness for the model''s intended role, not absolute SOTA performance.
  
        '
      values:
        low: Often needs retries; lightweight or routing tasks
        medium: Generally reliable local assistant
        high: Strong local model; fewer retries for its category
      ranking_weight:
        low: 1
        medium: 2
        high: 3
  runtime:
    route_policy:
      prefer_local: true
      allow_cloud_fallback: true
      default_provider: chocolatefactory
      provider_order:
      - chocolatefactory
      - switchyard
      - chadjeopardy
      - mechatropic
    cooldown:
      base_seconds: 30
      cap_seconds: 900
    compaction:
      strategy: sliding_window_with_summary
      summary_model_role: compact
      summary_refresh:
        trigger_context_tokens: 1200
        source_context_tokens: 2000
        response_tokens_budget: 256
        max_summary_chars: 5000
        min_interval_seconds: 120
        min_delta_tokens: 300
        force_refresh_tokens: 4000
  provider_defaults:
    chocolatefactory:
      provider: ChocolateFactory
      credential_key: chocolatefactory
      enabled: true
      provider_cost_tier: free
      engine: Gemma / Gemini API
      base_url: https://generativelanguage.googleapis.com
      api_kind: chocolatefactory_generative_language
      auth_type: api_key_query
      key_param: key
      setup_url: https://aistudio.google.com/apikey
      docs_url: https://ai.google.dev/gemini-api/docs
      api_key_label: ChocolateFactory API key
      api_key_hint: Paste your API key from AI Studio.
    switchyard:
      provider: Switchyard
      credential_key: switchyard
      enabled: false
      provider_cost_tier: low
      engine: OpenRouter Route
      base_url: https://openrouter.ai
      api_kind: generic_chat
      auth_type: bearer_header
      header_name: Authorization
      bearer_prefix: Bearer
      setup_url: https://openrouter.ai/settings/keys
      docs_url: https://openrouter.ai/docs
      api_key_label: Switchyard API key
      api_key_hint: Paste your OpenRouter API key.
      provider_cooldown:
        base_seconds: 60
        cap_seconds: 1800
    chadjeopardy:
      provider: ChadJeopardy
      credential_key: chadjeopardy
      enabled: false
      provider_cost_tier: paid
      engine: GPT
      base_url: https://api.openai.com
      api_kind: generic_responses
      auth_type: bearer_header
      header_name: Authorization
      bearer_prefix: Bearer
      setup_url: https://platform.openai.com/api-keys
      docs_url: https://platform.openai.com/docs
      api_key_label: ChadJeopardy API key
      api_key_hint: Paste your API key for this provider.
    mechatropic:
      provider: Mechatropic
      credential_key: mechatropic
      enabled: false
      provider_cost_tier: paid
      engine: Claude
      base_url: https://api.anthropic.com
      api_kind: mechatropic_messages
      auth_type: header_key
      header_name: x-api-key
      setup_url: https://console.anthropic.com/settings/keys
      docs_url: https://docs.anthropic.com/
      api_key_label: Mechatropic API key
      api_key_hint: Paste your API key for this provider.
  Models:
    Web:
    - provider: Meta
      engine: Llama
      url: https://www.meta.ai
      generosity: Very High
      login_required: Optional
      notes: '- Near-unlimited casual use with no strict message caps
  
        - Basic chats can be started anonymously
  
        - Account required for chat history and full features
  
        '
    - provider: Microsoft
      engine: Copilot
      url: https://copilot.microsoft.com/
      generosity: High
      login_required: true
      notes: '- Generous limits for text chat
  
        - Minimal throttling for most users
  
        - Requires Microsoft account (often already present via Windows or Outlook)
  
        '
    - provider: Google
      engine: Gemini
      url: https://gemini.google.com
      generosity: Medium-High
      login_required: true
      notes: '- Daily prompt limits vary (often 50+ prompts)
  
        - Limits reset frequently
  
        - Strong integration with Google Workspace
  
        '
    - provider: xAI
      engine: Grok
      url: https://grok.com/
      generosity: Medium
      login_required: true
      notes: "- Time-based message limits (roughly 10-20 per period)\n- Higher limits available with X Premium\n- Can become\
        \ unavailable during peak usage with \u201Cunder heavy usage\u201D errors\n- Strong real-time and social-context responses\n"
    - provider: Mistral AI
      engine: LeChat
      url: https://chat.mistral.ai/
      generosity: Medium-High
      login_required: true
      notes: '- Good daily limits for both basic and advanced usage
  
        - Paid tier provides priority access
  
        - Fast responses and strong cost/performance trade-offs
  
        '
    - provider: DeepSeek
      engine: DeepSeek
      url: https://chat.deepseek.com/
      generosity: Very High
      login_required: Minimal
      notes: '- Fully free consumer chat with no strict caps
  
        - Minimal or optional signup for core usage
  
        - Popular for coding and technical tasks
  
        - Defaults to Chinese, add "answer in English" to your prompt
  
        '
    - provider: Alibaba
      engine: Qwen
      url: https://qwen.ai/
      generosity: Medium
      login_required: true
      notes: '- Usable free tier with moderate limits
  
        - Strong multilingual performance
  
        - More generous for lighter or international usage
  
        - Very large user base in Asia
  
        '
    - provider: Perplexity
      engine: GPT
