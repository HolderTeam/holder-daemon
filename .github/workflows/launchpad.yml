name: Upload holder-daemon to Launchpad

on:
  push:
    tags:
      - "holder-daemon-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional upstream version override, for example 0.1.7"
        required: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        series:
          - noble
          - resolute

    steps:
      - uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt update
          sudo apt install -y \
            devscripts \
            debhelper \
            dput \
            gnupg \
            equivs

      - name: Import GPG key
        env:
          PPA_GPG_PRIVATE_KEY: ${{ secrets.PPA_GPG_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          echo "$PPA_GPG_PRIVATE_KEY" | gpg --batch --import

          KEYID="$(gpg --list-secret-keys --with-colons | awk -F: '/^sec:/ {print $5; exit}')"
          echo "DEBSIGN_KEYID=$KEYID" >> "$GITHUB_ENV"
          echo "Using GPG key: $KEYID"

          cat > ~/.gnupg/gpg.conf <<EOF
          batch
          yes
          pinentry-mode loopback
          EOF

          cat > ~/.gnupg/gpg-agent.conf <<EOF
          allow-loopback-pinentry
          EOF

          gpgconf --kill gpg-agent

      - name: Prepare Debian directory
        env:
          SERIES: ${{ matrix.series }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          rm -rf debian build
          cp -a packaging/linux/debian ./debian

          VERSION="$(tr -d '[:space:]' < VERSION)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "VERSION must contain a semantic version like 0.1.0; got '$VERSION'" >&2
            exit 1
          fi

          if [ -n "$INPUT_VERSION" ]; then
            if [ "$INPUT_VERSION" != "$VERSION" ]; then
              echo "workflow input version '$INPUT_VERSION' does not match VERSION '$VERSION'" >&2
              exit 1
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#holder-daemon-v}"
            if [ "$TAG_VERSION" != "$VERSION" ]; then
              echo "tag version '$TAG_VERSION' does not match VERSION '$VERSION'" >&2
              exit 1
            fi
          fi

          cat > debian/changelog <<EOF
          holder-daemon (${VERSION}~${SERIES}1) ${SERIES}; urgency=medium

            * Build for ${SERIES}

           -- Holder Team <holdercardteam@gmail.com>  $(date -R)
          EOF

      - name: Build signed source package
        env:
          DEBFULLNAME: "Holder Team"
          DEBEMAIL: "holdercardteam@gmail.com"
        run: |
          debuild -S -d -k"$DEBSIGN_KEYID"

      - name: Upload to Launchpad PPA
        run: |
          dput ppa:holderteam/holder ../*_source.changes
